# Spark detector job (milestone 2, step 8; streaming/job.py). The container is capped at 1.5 GiB
# (guardrail R1): the driver JVM (heap below + ~250 MiB off-heap), the driver Python process
# (~350 MiB: mlflow, polars), and one Python worker per core (~300 MiB each: polars, pandas,
# scikit-learn, the champion). Measured 2026-11-27 with local[2]: 1.49 GiB anonymous memory, the
# limit hit 774 times in 15 micro-batches; one core leaves headroom and still scores a replayed
# day in seconds.
version: 1
master: local[1]
# One state-store partition per core. Fixed for a checkpoint's life: changing it needs a new one.
shuffle_partitions: 1
driver_memory: 512m
# One local day of 144 cells per micro-batch at most, so a fast replay (--speed 0) does not
# land in one huge batch.
max_offsets_per_trigger: 20736
trigger_seconds: 10
# A (replay run, cell) that sends nothing for this long is dropped from the state (bounded state).
state_timeout_minutes: 60
# State-store versions kept in the checkpoint (Spark's default 100 keeps ~100 copies of the
# whole per-cell history on disk).
min_batches_to_retain: 10
