# Entity types, ID formats, and relations. Single source of truth (Rule 15; docs/domain-model.md §2).
# Topology levels (Core → Cell) are SYNTHETIC: generated from Milan grid squares by proximity.
version: 1

entities:
  Core:
    id_pattern: '^CORE-[0-9]+$'
    parent: null
    topology_level: 0
  AggregationNode:
    id_pattern: '^AGG-[0-9]+$'
    parent: Core
    topology_level: 1
  Site:
    id_pattern: '^SITE-[0-9]+$'
    parent: AggregationNode
    topology_level: 2
  Cell:
    id_pattern: '^CELL-[0-9]+-[0-9]+$'   # CELL-<site number>-<sector>
    parent: Site
    topology_level: 3
  Alarm:
    id_pattern: '^ALM-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
  Incident:
    id_pattern: '^INC-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
  ChangeEvent:
    id_pattern: '^CHG-[0-9]+$'

relations:
  - {name: parent_of, src: Core, dst: AggregationNode}
  - {name: parent_of, src: AggregationNode, dst: Site}
  - {name: parent_of, src: Site, dst: Cell}
  - {name: raised_on, src: Alarm, dst: Cell}
  - {name: grouped_into, src: Alarm, dst: Incident}
  - {name: applied_to, src: ChangeEvent, dst: Site}

teams:
  - {code: ran, name: RAN}
  - {code: field_ops, name: Field Ops}
  - {code: transport, name: Transport}
  - {code: ran_capacity, name: RAN Capacity}
  - {code: core_config, name: Core/Config}
