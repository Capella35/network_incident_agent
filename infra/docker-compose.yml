# Local stack for Network Incident Agent (milestone 1, step 6).
#
#   make up            # = docker compose --env-file .env -f infra/docker-compose.yml up -d --wait
#   make detect        # the Spark detector job: off by default, only under the `spark` profile
#
# Guardrails (specs/08-guardrails.md):
#   S1  every published port is bound to 127.0.0.1
#   S2  passwords come from .env; `preflight` refuses to start the stack with .env.example
#       placeholders; Grafana anonymous access and sign-up are off
#   S5  every image tag is pinned (no `latest`)
#   R1  every container has a memory limit (laptop: 8 GB RAM, Docker Desktop ~5 GB)
#   R2  Kafka topics have bounded retention (see kafka/create-topics.sh)
#
# Memory budget (default stack): kafka 1 GiB + postgres 512 MiB + mlflow 768 MiB
# + grafana 640 MiB = ~2.9 GiB. The detector (Spark, profile) adds 1.5 GiB (~4.4 GiB of ~5.3 GiB).
#
# Host ports come from .env: POSTGRES_PORT (5433), MLFLOW_PORT (5001), GRAFANA_PORT (3000).
# Inside the Compose network the services keep their standard ports (postgres:5432, mlflow:5000).

name: netops

x-base: &base
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-after-preflight: &after-preflight
  preflight:
    condition: service_completed_successfully

services:
  # Fails fast if .env is missing a password, still holds the .env.example placeholder,
  # or a password is too short. Prints variable names only, never values.
  preflight:
    image: postgres:18.7-alpine3.23
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "/preflight/preflight.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PIPELINE_WRITER_PASSWORD: ${PIPELINE_WRITER_PASSWORD:?set PIPELINE_WRITER_PASSWORD in .env}
      READONLY_PASSWORD: ${READONLY_PASSWORD:?set READONLY_PASSWORD in .env}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - ./preflight.sh:/preflight/preflight.sh:ro
      - ../.env.example:/preflight/env.example:ro
    deploy:
      resources:
        limits: { memory: 64m }

  kafka:
    <<: *base
    image: apache/kafka:4.3.2
    depends_on: *after-preflight
    environment:
      # Single-node KRaft (broker + controller in one process, no ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL: other containers (kafka:19092). HOST: the laptop (localhost:9092).
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  # topics only via kafka-init
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 1g }

  # Creates telemetry.raw and telemetry.dlq (idempotent) and enforces their retention.
  kafka-init:
    image: apache/kafka:4.3.2
    security_opt: ["no-new-privileges:true"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka:19092
      KAFKA_HEAP_OPTS: -Xms64m -Xmx128m
    volumes:
      - ./kafka/create-topics.sh:/init/create-topics.sh:ro
    deploy:
      resources:
        limits: { memory: 256m }

  postgres:
    <<: *base
    image: postgres:18.7-alpine3.23
    depends_on: *after-preflight
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netops}
      POSTGRES_USER: ${POSTGRES_USER:-netops_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Read only by db/000_roles.sh on first start (empty volume).
      PIPELINE_WRITER_PASSWORD: ${PIPELINE_WRITER_PASSWORD:?set PIPELINE_WRITER_PASSWORD in .env}
      READONLY_PASSWORD: ${READONLY_PASSWORD:?set READONLY_PASSWORD in .env}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 512m }

  mlflow:
    <<: *base
    image: ghcr.io/mlflow/mlflow:v3.17.2
    depends_on: *after-preflight
    environment:
      MLFLOW_DISABLE_TELEMETRY: "true"
      DO_NOT_TRACK: "true"
      # MLflow 3.x starts a job runner + 7 huey worker processes by default (~1.1 GB),
      # which hit the 768m limit and were OOM-killed every ~50 s (2026-11-22). We only use
      # tracking + registry; the promotion gate runs in our code, so server jobs stay off.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    command:
      - mlflow
      - server
      - --host=0.0.0.0  # inside the container only; the host side is 127.0.0.1
      - --port=5000
      - --workers=1
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
      - --allowed-hosts=localhost,localhost:${MLFLOW_PORT:-5001},127.0.0.1,127.0.0.1:${MLFLOW_PORT:-5001},mlflow,mlflow:5000
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5001}:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/health', timeout=4)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 768m }

  grafana:
    <<: *base
    image: grafana/grafana:13.2.6
    depends_on:
      <<: *after-preflight
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Go runtime: collect garbage before the container limit, not after (2026-11-22: at 384m
      # with no GOMEMLIMIT, Grafana was OOM-killed 3 times while the dashboard was in use).
      GOMEMLIMIT: 480MiB
      # Only the PostgreSQL data source is used. Each other backend plugin ran as its own
      # process (~25-35 MB each, ~380 MB in total), and the preinstalled apps run background work.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_DISABLE_PLUGINS: >-
        elasticsearch,influxdb,prometheus,stackdriver,zipkin,jaeger,loki,mssql,mysql,opentsdb,tempo,grafana-pyroscope-datasource,grafana-advisor-app,grafana-exploretraces-app,grafana-lokiexplore-app,grafana-metricsdrilldown-app,grafana-pyroscope-app
      # Data source for step 9 (provisioned as code; readonly DB user).
      READONLY_PASSWORD: ${READONLY_PASSWORD:?set READONLY_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-netops}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      # Step 9: data source + dashboards as code (generated by `make dashboards`), read-only.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 640m }

  # The Spark detector job (milestone 2, step 8; src/streaming/job.py). Off by default: only
  # under the `spark` profile (make detect / make spark-smoke). Built from infra/spark/Dockerfile.
  detector:
    <<: *base
    # A crash restarts it from its checkpoint; a job that cannot start (no champion, a checkpoint
    # of another detector version) exits 1 and must not loop.
    restart: on-failure:3
    build:
      context: ..
      dockerfile: infra/spark/Dockerfile
    image: netops-detector:m2-step8
    profiles: ["spark"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_DISABLE_AGENT_HINT: "1"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-netops}
      PIPELINE_WRITER_PASSWORD: ${PIPELINE_WRITER_PASSWORD:?set PIPELINE_WRITER_PASSWORD in .env}
      # One thread per pool in each Python worker: the cores are Spark's (local[2]), and every
      # BLAS / polars thread pool costs memory inside the 1.5 GiB limit.
      POLARS_MAX_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    ports:
      - "127.0.0.1:4040:4040"  # Spark UI
    volumes:
      - spark-checkpoints:/checkpoints
    deploy:
      resources:
        limits: { memory: 1536m }

volumes:
  spark-checkpoints:
  kafka-data:
  postgres-data:
  mlflow-data:
  grafana-data:
