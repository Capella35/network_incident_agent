# Dashboards are files generated by `make dashboards` (src/common/grafana.py), mounted read-only.
apiVersion: 1

providers:
  - name: netops
    folder: Network Incident Agent
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
