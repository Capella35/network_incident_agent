# Generated by `make dashboards` (src/common/grafana.py); never edit by hand.
apiVersion: 1
groups:
- folder: Network Incident Agent
  interval: 60s
  name: detector-health
  orgId: 1
  rules:
  - annotations:
      dashboardUId: netops-detector-health
      summary: 'Telemetry has waited over 5 min with no detector heartbeat: is the
        Spark job running (make detect)?'
    condition: B
    data:
    - datasourceUid: netops-postgres
      model:
        datasource:
          type: grafana-postgresql-datasource
          uid: netops-postgres
        editorMode: code
        format: table
        rawQuery: true
        rawSql: 'SELECT coalesce(extract(epoch FROM now() - min(ingested_at)) / 60,
          0) AS unscored_minutes

          FROM telemetry_raw

          WHERE ingested_at > coalesce((SELECT max(at) FROM detector_heartbeats),
          ''-infinity'')'
        refId: A
      refId: A
      relativeTimeRange:
        from: 600
        to: 0
    - datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 5
            type: gt
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        refId: B
        type: threshold
      refId: B
    execErrState: Error
    for: 1m
    isPaused: false
    labels:
      component: detector
    noDataState: OK
    title: Dead detector
    uid: netops-dead-detector
