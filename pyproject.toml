[project]
name = "network-incident-agent"
version = "0.0.1"
description = "Telecom network incident detection, correlation, and a human-gated ops agent (portfolio project; synthetic topology and faults)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Exact versions are pinned in uv.lock (guardrail S5). Add runtime deps per milestone step.
dependencies = [
    "confluent-kafka>=2.6",
    "mlflow-skinny==3.17.2",
    "pandas>=2.2",
    "polars>=2.1.0",
    "psycopg[binary]>=3.3.9",
    "pyarrow>=21",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "scikit-learn>=1.7",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# One package per component under src/ (see DECISIONS.md 2026-11-14). Add each as it gets code.
packages = ["src/common", "src/producer", "src/streaming", "src/models"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "C90", "ERA", "PLR"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # assert is fine in tests
    "PLR2004",  # literal expected values (e.g. 20736 rows) are the point of a test
    "PLR0913",  # fixtures and parametrized tests take many arguments
]

# The guard hook is user-owned (Claude cannot edit .claude/hooks/); its one literal stays.
".claude/hooks/guard.py" = ["PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
# Up to 7 parameters, but only 5 positional: options beyond that must be keyword-only.
max-args = 7
max-positional-args = 5

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["common", "producer", "streaming", "models"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# scikit-learn ships no type information (checked 1.9.1); scoped to that package only.
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the local Docker stack; not run in CI",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
# CI fails below this. Code that only runs against the live stack (Kafka/Postgres CLIs) is
# covered by `make test-integration`, which CI cannot run; keep the rest above the floor.
fail_under = 85
