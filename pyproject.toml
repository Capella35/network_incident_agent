[project]
name = "network-incident-agent"
version = "0.0.1"
description = "Telecom network incident detection, correlation, and a human-gated ops agent (portfolio project; synthetic topology and faults)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Exact versions are pinned in uv.lock (guardrail S5). Add runtime deps per milestone step.
dependencies = [
    "polars>=2.1.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# One package per component under src/ (see DECISIONS.md 2026-11-14). Add each as it gets code.
packages = ["src/common", "src/producer"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["common", "producer"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the local Docker stack; not run in CI",
]

[tool.coverage.run]
source = ["src"]
